# nginx site for Doshin. setup_server.sh copies this to /etc/nginx/sites-available/salesai,
# filling in __DOMAIN__ (domain or IP), __CERT__ and __KEY__ (Let's Encrypt files for a
# domain, a self-signed pair for an IP). For a domain it first serves an HTTP-only bootstrap
# so certbot's challenge can be answered.

upstream salesai {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP: ACME challenges + redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # "listen … ssl http2" works on nginx 1.24 (Ubuntu 24.04) and newer; "http2 on;" needs 1.25.1+
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # Let's Encrypt for a domain; a self-signed certificate while the site runs on its IP
    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;     # research runs and Copilot answers can be slow

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Copilot streaming answers (POST /api/copilot/chat/stream, text/event-stream):
    # no buffering so tokens reach the browser as they are generated.
    location /api/copilot/chat {
        proxy_pass http://salesai;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://salesai;
    }
}
