# nginx site for Doshin. setup_server.sh copies this to /etc/nginx/sites-available/salesai
# with __DOMAIN__ replaced; certbot (--nginx) then adds the TLS certificate lines to the
# 443 server below. Before the certificate exists, setup_server.sh serves the bootstrap
# (HTTP-only) variant so certbot's challenge can be answered.

upstream salesai {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP: ACME challenges + redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;     # research runs and Copilot answers can be slow

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Copilot streaming answers (POST /api/copilot/chat/stream, text/event-stream):
    # no buffering so tokens reach the browser as they are generated.
    location /api/copilot/chat {
        proxy_pass http://salesai;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://salesai;
    }
}
