<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forecast | Doshin</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css?v=3.0">
  <link rel="stylesheet" href="css/base.css?v=4.1">
  <link rel="stylesheet" href="css/shell.css?v=3.0">
  <link rel="stylesheet" href="css/deals.css?v=1.3">
  <link rel="stylesheet" href="css/forecast.css?v=1.4">
</head>
<body>

<div class="dash-shell">

{% include "partials/topbar.html" %}

  <div class="dash-body dl-body">
    <main class="dl-main" aria-label="Forecast">
      <header class="dl-header">
        <div>
          <a href="/deals" class="dl-back"><i class="fa-solid fa-arrow-left"></i> Deals pipeline</a>
          <h1 class="dl-title"><i class="fa-solid fa-chart-line"></i> Forecast</h1>
          <p class="dl-sub" id="fcSub">Loading…</p>
        </div>
        <div class="dl-tools">
          <select id="fcPeriod" class="dl-select" aria-label="Fiscal quarter"></select>
          <select id="fcBusinessLine" class="dl-select" aria-label="Business line"><option value="">All business lines</option></select>
          <select id="fcOwner" class="dl-select" aria-label="Owner"><option value="">Everyone I can see</option></select>
          <button type="button" class="dl-btn fc-exec-btn" id="fcExecBtn" aria-pressed="false" title="Hide deal-level detail and group by business line"><i class="fa-solid fa-user-tie"></i> Leadership view</button>
          <button type="button" class="dl-btn" id="fcTargetsBtn" hidden><i class="fa-solid fa-bullseye"></i> Targets</button>
          <button type="button" class="dl-btn" id="fcFxBtn" hidden><i class="fa-solid fa-coins"></i> Exchange rates</button>
          <button type="button" class="dl-btn" id="fcExport"><i class="fa-regular fa-file-excel"></i> Export</button>
        </div>
      </header>

      <div class="fc-banner" id="fcBanner" hidden></div>

      <section class="fc-verdict" id="fcVerdict" aria-label="Where the quarter stands" aria-live="polite"></section>
      <section class="fc-kpis" id="fcKpis" aria-label="Forecast summary"></section>
      <section class="fc-bar-wrap" id="fcBar" aria-label="Progress to target"></section>
      <section class="fc-quality fc-detail" id="fcQuality" aria-label="Forecast quality"></section>

      <div class="fc-grid fc-charts">
        <section class="fc-panel" aria-labelledby="fcTrendTitle">
          <div class="fc-panel-head"><h2 id="fcTrendTitle">Forecast trend <button type="button" class="fc-info" data-term="trend" aria-label="About the forecast trend"><i class="fa-solid fa-circle-info"></i></button></h2><span class="fc-muted">Week by week through the quarter</span></div>
          <div id="fcTrend"></div>
        </section>
        <section class="fc-panel" aria-labelledby="fcBridgeTitle">
          <div class="fc-panel-head"><h2 id="fcBridgeTitle">Why the Commit forecast moved <button type="button" class="fc-info" data-term="bridge" aria-label="About this chart"><i class="fa-solid fa-circle-info"></i></button></h2></div>
          <div id="fcBridge"></div>
        </section>
      </div>

      <div class="fc-grid fc-main-grid">
        <section class="fc-panel" aria-labelledby="fcRollupTitle">
          <div class="fc-panel-head">
            <h2 id="fcRollupTitle">Roll-up</h2>
            <div class="fc-seg" role="group" aria-label="Group by">
              <button type="button" data-group="owner" class="active">Owner</button>
              <button type="button" data-group="business_line">Business line</button>
              <button type="button" data-group="stage">Stage</button>
              <button type="button" data-group="category">Category</button>
            </div>
          </div>
          <div class="fc-table-wrap" id="fcRollup"></div>
        </section>
        <section class="fc-panel fc-detail" aria-labelledby="fcChangesTitle">
          <div class="fc-panel-head"><h2 id="fcChangesTitle">What moved</h2><span class="fc-muted" id="fcChangesSince"></span></div>
          <div id="fcChanges" class="fc-changes"></div>
        </section>
      </div>

      <section class="fc-panel fc-detail" aria-labelledby="fcKeyTitle">
        <div class="fc-panel-head"><h2 id="fcKeyTitle">Deals that decide the quarter <button type="button" class="fc-info" data-term="key_deals" aria-label="About these deals"><i class="fa-solid fa-circle-info"></i></button></h2><span class="fc-muted" id="fcKeySub"></span></div>
        <div class="fc-table-wrap" id="fcKeyDeals"></div>
      </section>

      <section class="fc-panel fc-detail" aria-labelledby="fcDealsTitle">
        <div class="fc-panel-head"><h2 id="fcDealsTitle">Deals in this quarter</h2>
          <span class="fc-filter" id="fcDealFilter" hidden></span></div>
        <div class="fc-table-wrap" id="fcDeals"></div>
        <div id="fcUndated"></div>
      </section>
    </main>
  </div>
</div>

<!-- Targets / exchange rates dialog -->
<div class="dl-modal-wrap" id="fcModal" hidden>
  <div class="dl-modal fc-modal" role="dialog" aria-modal="true" aria-labelledby="fcModalTitle">
    <header><h2 id="fcModalTitle"></h2><button type="button" class="dl-icon" data-close-modal aria-label="Close"><i class="fa-solid fa-xmark"></i></button></header>
    <div id="fcModalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

{% include "partials/copilot-dock.html" %}
<script type="module" src="js/modules/forecast/main.js?v=1.4"></script>
</body>
</html>
