name: Deploy to production

# tests → build image → push to ECR (tag = commit SHA) → SSH to EC2 → remote_deploy.sh
# (pull, start, health check, automatic rollback) → public health check.
#
# Runs from "Actions → Deploy to production → Run workflow" (pick the branch). Every run
# waits for a reviewer if the "production" environment has required reviewers.
#
# GitHub → Settings → Environments → production:
#   Variables: AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY_URI, EC2_HOST, SITE_URL
#   Secrets:   DEPLOY_SSH_KEY (private key, deploy user), EC2_KNOWN_HOSTS (ssh-keyscan output),
#              ENV_FILE (the whole production .env — see deploy/.env.production.example)
# See deploy/AWS_SETUP.md and DEPLOYMENT_REVIEW.md Phase 4.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false      # never kill a deploy half-way

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests (no database, no secrets)
        run: python -m pytest tests/ -q

  build-push:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write            # GitHub OIDC → AWS role, no stored AWS keys
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        # Prints a status line for every setting (variable VALUES are shown — they aren't
        # sensitive; secrets only as present / missing, never their values), then fails once
        # with the full list of problems.
        run: |
          fail=0
          ok()  { printf '  ok    %-22s %s\n' "$1" "$2"; }
          bad() { printf '  FAIL  %-22s %s\n' "$1" "$2"; fail=1; }
          warn(){ printf '  WARN  %-22s %s\n' "$1" "$2"; }

          echo "Variables (Settings → Environments → production → Variables):"
          SITE_URL="${SITE_URL%/}"
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then bad AWS_DEPLOY_ROLE_ARN "missing"
          elif echo "$AWS_DEPLOY_ROLE_ARN" | grep -Eq '^arn:aws:iam::[0-9]{12}:role/.+'; then ok AWS_DEPLOY_ROLE_ARN "$AWS_DEPLOY_ROLE_ARN"
          else bad AWS_DEPLOY_ROLE_ARN "$AWS_DEPLOY_ROLE_ARN  <- must be IAM → Roles → salesai-github-deploy → ARN (…:role/…)"; fi
          if [ -z "$ECR_REPOSITORY_URI" ]; then bad ECR_REPOSITORY_URI "missing"
          elif echo "$ECR_REPOSITORY_URI" | grep -Eq '^[0-9]{12}[.]dkr[.]ecr[.]us-east-1[.]amazonaws[.]com/[a-z0-9._/-]+$'; then ok ECR_REPOSITORY_URI "$ECR_REPOSITORY_URI"
          else bad ECR_REPOSITORY_URI "$ECR_REPOSITORY_URI  <- expected <account>.dkr.ecr.us-east-1.amazonaws.com/sales-ai (no :tag)"; fi
          if [ -z "$EC2_HOST" ]; then bad EC2_HOST "missing"; else ok EC2_HOST "$EC2_HOST"; fi
          if [ -z "$SITE_URL" ]; then bad SITE_URL "missing"
          elif echo "$SITE_URL" | grep -Eq '^https://[^/]+$'; then ok SITE_URL "$SITE_URL"
          else bad SITE_URL "$SITE_URL  <- expected https://<host>"; fi

          echo "Same names also saved as SECRETS (delete these — the workflow reads the variables):"
          dup=""
          [ "$S_ROLE" = yes ] && dup="$dup AWS_DEPLOY_ROLE_ARN"
          [ "$S_ECR" = yes ]  && dup="$dup ECR_REPOSITORY_URI"
          [ "$S_HOST" = yes ] && dup="$dup EC2_HOST"
          [ "$S_SITE" = yes ] && dup="$dup SITE_URL"
          [ "$S_ABU" = yes ]  && dup="$dup APP_BASE_URL(belongs-inside-ENV_FILE)"
          echo "  ${dup:-none}"

          echo "Secrets (present / missing only; the SSH ones are used by the deploy job, so only warned here):"
          if [ "$S_SSH" = yes ]; then ok DEPLOY_SSH_KEY present; else warn DEPLOY_SSH_KEY "missing — the deploy job will stop"; fi
          if [ "$S_KNOWN" = yes ]; then ok EC2_KNOWN_HOSTS present; else warn EC2_KNOWN_HOSTS "missing — add: ssh-keyscan -t ed25519 <EC2_HOST>; the deploy job will stop"; fi
          if [ "$S_ENV" = yes ]; then ok ENV_FILE present; else bad ENV_FILE missing; fi

          if [ "$S_ENV" = yes ]; then
            echo "ENV_FILE contents (setting names only, never values):"
            printf '%s\n' "$ENV_FILE" > /tmp/envcheck
            for k in DATABASE_URL JWT_SECRET_KEY CONFIG_ENCRYPTION_KEY SITE_URL APP_BASE_URL; do
              if grep -Eq "^$k=.+" /tmp/envcheck; then ok "$k" set; else bad "$k" "missing or empty"; fi
            done
            if grep -Eq '^AUTH_ENFORCED=true$' /tmp/envcheck; then ok AUTH_ENFORCED true; else bad AUTH_ENFORCED "must be exactly AUTH_ENFORCED=true"; fi
            if grep -Eq '^COOKIE_SECURE=true$' /tmp/envcheck; then ok COOKIE_SECURE true; else bad COOKIE_SECURE "must be COOKIE_SECURE=true (served over HTTPS)"; fi
            # DATABASE_URL shape — explained without printing the value
            dburl="$(grep -E '^DATABASE_URL=' /tmp/envcheck | head -1 | cut -d= -f2-)"
            case "$dburl" in
              \"*|\'*) bad DATABASE_URL "remove the quotes around the value (Docker keeps them)";;
              postgresql://*|postgres://*|postgresql+psycopg2://*)
                rest="${dburl#*://}"
                case "$rest" in *@*) ;; *) bad DATABASE_URL "no user:password@ part — expected postgresql://saadmin:<password>@<rds-endpoint>:5432/sales_ai?sslmode=require";; esac
                dbhost="$(echo "$rest" | sed -E 's#^[^@]*@([^:/?]+).*#\1#')"
                case "$dbhost" in
                  localhost|127.0.0.1|host.docker.internal) bad DATABASE_URL "points at $dbhost — must be the RDS endpoint (…rds.amazonaws.com)";;
                  *.rds.amazonaws.com) ok DATABASE_URL "host is an RDS endpoint";;
                  *) warn DATABASE_URL "host isn't an *.rds.amazonaws.com endpoint — check it's the RDS one";;
                esac
                case "$dburl" in *sslmode=require*) ;; *) warn DATABASE_URL "add ?sslmode=require (RDS over TLS)";; esac;;
              "") ;;
              *) bad DATABASE_URL "must start with postgresql:// (got another scheme)";;
            esac
            if grep -Eq '^(DATABASE_URL_NEON|DB_USE_LOCAL)=' /tmp/envcheck; then bad NEON/LOCAL "remove DATABASE_URL_NEON / DB_USE_LOCAL — production uses DATABASE_URL only"; fi
            if grep -Eq '^[A-Z0-9_]+=.*[[:space:]]#' /tmp/envcheck; then bad "inline comments" "a value is followed by '# …' — Docker keeps that as part of the value"; fi
            q="$(grep -Eo '^[A-Z0-9_]+=["'"'"']' /tmp/envcheck | cut -d= -f1 | tr '\n' ' ')"
            if [ -n "$q" ]; then bad "quoted values" "remove the quotes from: $q(Docker keeps them as part of the value)"; fi
            if grep -q $'\r' /tmp/envcheck; then bad "line endings" "ENV_FILE has Windows (CRLF) line endings — re-paste it from a plain-text editor"; fi
            if grep -Eq '^COOKIE_SECURE=false' /tmp/envcheck; then echo "        (COOKIE_SECURE=false is the development setting — production is HTTPS)"; fi
            rm -f /tmp/envcheck
          fi

          echo "Run: commit ${GITHUB_SHA::12} on ${GITHUB_REF_NAME}"
          if [ "$fail" != 0 ]; then echo; echo "Fix the FAIL lines above, then start a NEW run (Run workflow, not Re-run)."; exit 1; fi
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          SITE_URL: ${{ vars.SITE_URL }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          S_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' && 'yes' || 'no' }}
          S_ECR: ${{ secrets.ECR_REPOSITORY_URI != '' && 'yes' || 'no' }}
          S_HOST: ${{ secrets.EC2_HOST != '' && 'yes' || 'no' }}
          S_SITE: ${{ secrets.SITE_URL != '' && 'yes' || 'no' }}
          S_ABU: ${{ secrets.APP_BASE_URL != '' && 'yes' || 'no' }}
          S_SSH: ${{ secrets.DEPLOY_SSH_KEY != '' && 'yes' || 'no' }}
          S_KNOWN: ${{ secrets.EC2_KNOWN_HOSTS != '' && 'yes' || 'no' }}
          S_ENV: ${{ secrets.ENV_FILE != '' && 'yes' || 'no' }}

      - name: Show the OIDC claims AWS will check
        # Prints only the claims the role's trust policy compares (never the token itself),
        # so a trust-policy mismatch can be fixed by copying the exact "sub" value.
        run: |
          echo "commit           = ${GITHUB_SHA::12} (branch ${GITHUB_REF_NAME})"
          echo "role to assume   = ${{ vars.AWS_DEPLOY_ROLE_ARN }}"
          echo "region           = $AWS_REGION"
          echo "--- token claims (the role's trust policy must match sub and aud) ---"
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          printf '%s' "$tok" | cut -d. -f2 | python3 -c '
          import sys, json, base64
          p = sys.stdin.read().strip(); p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ("sub", "aud", "repository", "environment", "ref", "repository_owner"):
              print(f"{k:17}= {c.get(k)}")'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        run: echo "image=${{ vars.ECR_REPOSITORY_URI }}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          if aws ecr describe-images --region "$AWS_REGION" --repository-name "${ECR_REPO##*/}" \
               --image-ids imageTag="${GITHUB_SHA::12}" >/dev/null 2>&1; then
            echo "Image ${{ steps.meta.outputs.image }} already in ECR — reusing it."
          else
            docker build -t "${{ steps.meta.outputs.image }}" .
            docker push "${{ steps.meta.outputs.image }}"
          fi
        env:
          ECR_REPO: ${{ vars.ECR_REPOSITORY_URI }}

  deploy:
    needs: build-push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          printf 'Host app\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking yes\n  ConnectTimeout 20\n' \
            "${{ vars.EC2_HOST }}" > ~/.ssh/config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}

      - name: Upload compose file, deploy script and .env
        run: |
          scp -q deploy/docker-compose.prod.yml deploy/remote_deploy.sh app:/opt/salesai/
          printf '%s\n' "$ENV_FILE" | ssh app 'umask 077 && cat > /opt/salesai/.env.new && mv /opt/salesai/.env.new /opt/salesai/.env'
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Deploy (pull, start, health check, rollback on failure)
        run: ssh app "bash /opt/salesai/remote_deploy.sh '${{ needs.build-push.outputs.image }}'"

      - name: Public health check
        run: |
          # While the site runs on its bare IP the certificate is self-signed: skip verification then.
          site="${SITE_URL%/}"
          host="$(echo "$site" | sed -E 's#^https?://([^/:]+).*#\1#')"
          insecure=""; echo "$host" | grep -Eq '^[0-9]+(\.[0-9]+){3}$' && insecure="-k"
          for i in $(seq 1 12); do
            if curl -fsS $insecure --max-time 10 "$site/api/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "Public health check failed"; exit 1
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy
