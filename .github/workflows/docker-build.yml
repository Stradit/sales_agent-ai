name: Docker image build & smoke test

# Builds the production image on a Linux runner and starts it against a throwaway
# Postgres 18 with production-like settings (AUTH_ENFORCED=true, background loops off,
# no outbound email). Proves the image migrates an empty DB (db.migrate upgrade), starts,
# answers /api/health, serves the public pages and lets the seeded admin sign in.
# Nothing is pushed anywhere. See DEPLOYMENT_REVIEW.md, Phase 1.

on:
  workflow_dispatch:
  workflow_call:        # deploy.yml runs these checks before every production deploy
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "requirements.txt", "api.py", "auth.py", "config.py",
            "db/**", "apps/sales_*/**", "services/**", "migrations/**", "alembic.ini",
            "scripts/build_schema_baseline.py", ".github/workflows/docker-build.yml"]
  push:
    branches: [feature/crm-core-phase1, feature/sales-intelligence-pipeline]
    paths: ["Dockerfile", ".dockerignore", "requirements.txt", ".github/workflows/docker-build.yml"]

concurrency:
  # github.workflow is the CALLER's name when deploy.yml calls this, so a push-triggered run on the
  # same branch can't cancel the checks of a deploy in progress
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrations:
    # Schema changes go through versioned migrations (docs/DB_DEPLOYMENT_PLAN.md). This job proves:
    #  1. the migrations build an EMPTY database from nothing, and apply cleanly a second time (no-op);
    #  2. the baseline (0001) still equals what the legacy startup schema code builds - i.e. nobody
    #     changed schema.sql / create_tables.py instead of adding a migration;
    #  3. every migration after the baseline can be downgraded and re-applied.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: salesai
          POSTGRES_PASSWORD: migrations-ci-only
          POSTGRES_DB: sales_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salesai -d sales_ai"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://salesai:migrations-ci-only@127.0.0.1:5432/sales_ai
      PG_BIN: /usr/lib/postgresql/18/bin
      COPILOT_AUTOSYNC: "0"
      CRM_BACKGROUND: "0"
      SCHEDULER_ENABLED: "0"
      CRM_NOTIFY_SUPPRESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Throwaway secrets (the app refuses to import without them; nothing here is real)
        run: |
          echo "JWT_SECRET_KEY=ci-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CONFIG_ENCRYPTION_KEY=ci-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Postgres 18 client (pg_dump must match the server)
        run: |
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-18 >/dev/null
          "$PG_BIN/pg_dump" --version
      - run: pip install -r requirements.txt
      - name: Build an empty database from the migrations
        run: |
          python -m db.migrate status
          python -m db.migrate upgrade
          python -m db.migrate upgrade          # second run must be a no-op
          python -m db.migrate check
      - name: Baseline still matches the startup schema code
        run: python scripts/build_schema_baseline.py --check
      - name: Downgrade / re-upgrade every migration after the baseline
        run: |
          if [ "$(python -c 'from db.migrate import head_revision as h; print(h())')" != "0001" ]; then
            python -m alembic downgrade 0001 && python -m alembic upgrade head && python -m db.migrate check
          else
            echo "Only the baseline so far - nothing to downgrade."
          fi

  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: salesai
          POSTGRES_PASSWORD: smoke-test-only
          POSTGRES_DB: sales_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salesai -d sales_ai"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t salesai:smoke .

      - name: Image size
        run: docker image ls salesai:smoke --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

      - name: Migrate the empty database with the image (as remote_deploy.sh does)
        run: |
          docker run --rm --network host             -e DATABASE_URL=postgresql://salesai:smoke-test-only@127.0.0.1:5432/sales_ai             --entrypoint python salesai:smoke -m db.migrate upgrade
          docker run --rm --network host             -e DATABASE_URL=postgresql://salesai:smoke-test-only@127.0.0.1:5432/sales_ai             --entrypoint python salesai:smoke -m db.migrate check

      - name: Start container
        run: |
          docker run -d --name salesai --network host \
            -e DATABASE_URL=postgresql://salesai:smoke-test-only@127.0.0.1:5432/sales_ai \
            -e AUTH_ENFORCED=true \
            -e JWT_SECRET_KEY="$(openssl rand -hex 32)" \
            -e CONFIG_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e COOKIE_SECURE=false \
            -e COPILOT_AUTOSYNC=0 -e CRM_BACKGROUND=0 -e SCHEDULER_ENABLED=0 -e CRM_NOTIFY_SUPPRESS=1 \
            -e SEED_ADMIN_EMAIL=smoke-admin@example.invalid \
            -e SEED_ADMIN_PASSWORD=smoke-test-password-123 \
            salesai:smoke

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8000/api/health || true)
            if [ "$code" = "200" ]; then cat /tmp/health.json; echo; exit 0; fi
            sleep 3
          done
          echo "App never became healthy"; docker logs salesai; exit 1

      - name: Smoke checks
        run: |
          set -e
          check() {  # check <expected-code> <path> [curl args...]
            want=$1; path=$2; shift 2
            got=$(curl -s -o /tmp/out -w '%{http_code}' "$@" "http://127.0.0.1:8000$path")
            if [ "$got" = "$want" ]; then echo "ok   $path -> $got"; else echo "FAIL $path -> $got (expected $want)"; head -c 400 /tmp/out; echo; exit 1; fi
          }
          check 200 /
          check 200 /login
          check 200 /robots.txt
          check 200 /sitemap.xml
          check 200 /favicon.ico
          check 401 /api/deals
          TOKEN=$(curl -s -X POST http://127.0.0.1:8000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"smoke-admin@example.invalid","password":"smoke-test-password-123"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          [ -n "$TOKEN" ] && echo "ok   seeded admin signs in"
          check 200 /api/deals -H "Authorization: Bearer $TOKEN"
          check 200 /api/crm/introductions -H "Authorization: Bearer $TOKEN"
          check 200 /api/crm/roles -H "Authorization: Bearer $TOKEN"
          docker inspect --format 'container user: {{.Config.User}}' salesai

      - name: Container health status
        run: |
          sleep 35   # one HEALTHCHECK interval
          docker inspect --format 'docker health: {{.State.Health.Status}}' salesai

      - name: Logs on failure
        if: failure()
        run: docker logs salesai || true
