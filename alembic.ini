# Alembic — versioned schema migrations for the main app (docs/DB_DEPLOYMENT_PLAN.md).
# Use the wrapper rather than the raw alembic CLI:  python -m db.migrate status | upgrade | stamp-baseline
# The database URL comes from DATABASE_URL (environment first, then .env) — never from this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
